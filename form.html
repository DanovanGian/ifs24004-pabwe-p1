<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">IMDb Charts</a>
            <a href="cv.html">Curiculum Vitae</a>
            <a href="form.html">Form</a>
            <a href="blog.html">DevBlogs</a>
        </nav>
    </header>
    <hr>

    <main>
        <h1>Formulir Pendaftaran</h1>

        <fieldset><legend>Daftar Akun</legend>
            <form>
                <label>Nama Lengkap:
                    <input type="text" name="nama_lengkap" id="nama_lengkap">
                </label>
                <hr>

                Jenis Kelamin:
                <label><input type="radio" name="jk" value="Laki-Laki"> Laki-Laki</label>
                <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
                <hr>

                <label>Tempat Lahir:
                    <input type="text" name="tempat_lahir" id="tempat_lahir">
                </label>
                <hr>

                <label>Tanggal Lahir:
                    <input type="date" name="tanggal_lahir" id="tanggal_lahir">
                </label>
                <hr>

                <label for="agama">Agama:</label>
                <select name="Agama" id="agama">
                    <option value="">--Pilih Agama---</option>
                    <option value="Islam">Islam</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Protestan">Protestan</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Budha">Budha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
                <hr>

                Hobi:
                <label><input type="checkbox" name="hobi" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi" value="Ngoding"> Ngoding</label>
                <hr>

                <label>Password:
                    <input type="password" name="password" id="password">
                </label>
                <hr>

                <label>
                    <input type="checkbox" name="setuju" id="setuju">
                    Dengan mendaftar saya setuju dengan ketentuan dan kebijakan Privasi Aplikasi
                </label>
                <hr>

                <input type="reset" value="Reset">
                <input type="submit" value="Daftar">
            </form>
        </fieldset>
    </main>
</body>
</html>
