<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset><legend>Daftar Akun</legend>
        <form>
            Nama Lengkap :
            <input type="text" name="" id="">
            <hr>
            Jenis Kelamin : 
            <input type="radio" name="jk" value="Laki-Laki">Laki-Laki
            <input type="radio" name="jk" value="Perempuan">Perempuan
            <hr>
            Tempat Lahir :
            <input type="text" name="" id="">
            <hr>
            Tanggal Lahir :
            <input type="date" name="" id="">
            <hr>
            Agama :
            <select name="Agama">
                <option value="">--Pilih Agama---</option>
                <option value="">Islam</option>
                <option value="">Katolik</option>
                <option value="">Protestan</option>
                <option value="">Hindu</option>
                <option value="">Budha</option>
                <option value="">Konghucu</option>
            </select>
            <hr>
            Hobi :
            <input type="checkbox" name="" id="">Olahraga
            <input type="checkbox" name="" id="">Membaca
            <input type="checkbox" name="" id="">Ngoding
            <hr>
            Password:
            <input type="text" name="" id="">
            <hr>
            <input type="checkbox" name="" id="">Dengan mendaftar saya setuju dengan ketentuan dan kebijakan Privasi Aplikasi
            <hr>
            <input type="reset" name="" id="">
            <input type="submit" name="" id="">
        </form>

    
    </fieldset>
    
</body>
</html>
